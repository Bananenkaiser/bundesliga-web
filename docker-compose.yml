services:
  web:
    build: .
    container_name: bundesliga-web
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      # Default: bundesliga_data liegt als Schwester-Ordner neben diesem Repo.
      # Anderer Pfad -> in .env  BUNDESLIGA_DATA_DIR=/absoluter/pfad/zu/data
      # Nur Lesezugriff; die Pipeline schreibt weiter in ihr eigenes data/.
      - ${BUNDESLIGA_DATA_DIR:-../bundesliga_data/data}:/data:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tippspiel.rule=Host(`tippspiel.lan`)"
      - "traefik.http.services.tippspiel.loadbalancer.server.port=8000"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
